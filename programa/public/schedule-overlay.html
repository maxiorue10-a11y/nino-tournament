<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Pantalla de espera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* ============================================================================
   PANTALLA DE ESPERA (1920x1080, fondo transparente)
   - A la izquierda, la ventana principal: un video tuyo (queda transparente para
     que se vea la fuente de OBS de abajo), los partidos del dia o el Swiss Stage.
   - Abajo, el partido que viene.
   - A la derecha, una columna con el logo del torneo, los comentaristas, la
     cuenta regresiva "EMPEZAMOS EN" y los auspiciantes rotando.
   ============================================================================ */
:root{--gold:#e9b949;--gold2:#f6d98a;--blue:#2f80ff;--red:#ff3d55;
 --noche:#070a12;--navy:#0e1530;--linea:rgba(233,185,73,.45)}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:#eef2ff;
 font-family:var(--fh,'Barlow Condensed'),'Bahnschrift',sans-serif;text-transform:uppercase}
#app{position:relative;width:1920px;height:1080px;overflow:hidden}
.panel{position:absolute;
 background:radial-gradient(ellipse at 30% 0%,rgba(58,160,255,.14),transparent 60%),
  radial-gradient(ellipse at 90% 100%,rgba(233,185,73,.10),transparent 55%),
  repeating-linear-gradient(-60deg,rgba(233,185,73,.035) 0 1px,transparent 1px 28px),
  linear-gradient(180deg,#0e1530,#070a12 75%)}

/* ---------- ventana principal ---------- */
#main{position:absolute;left:0;top:0;width:1400px;height:848px}
/* modo video: queda hueca para que se vea el video de OBS, solo con un filo */
#main.video{background:transparent;box-shadow:inset 0 0 0 3px var(--linea)}
#main.lleno{overflow:hidden}
.mtit{position:absolute;left:60px;top:44px;font-size:64px;font-weight:800;letter-spacing:2px;line-height:1;
 color:var(--gold);text-shadow:0 0 24px rgba(233,185,73,.35)}
.msub{position:absolute;left:62px;top:112px;font-size:26px;letter-spacing:4px;color:#8d96b5}
.mpag{position:absolute;right:60px;top:64px;display:flex;gap:8px}
.mpag i{width:34px;height:7px;display:block;background:rgba(255,255,255,.16);transform:skewX(-20deg)}
.mpag i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
/* tarjetas de los partidos del dia */
.mlist{position:absolute;left:60px;right:60px;top:180px;display:flex;flex-direction:column;gap:22px}
.mc{position:relative;height:186px;display:grid;grid-template-columns:200px 1fr 120px 1fr;align-items:center;
 background:linear-gradient(90deg,rgba(30,43,87,.55),rgba(7,10,18,.75));
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:10px;overflow:hidden;
 animation:entra .6s cubic-bezier(.2,.9,.2,1) both}
.mc:nth-child(2){animation-delay:.08s}.mc:nth-child(3){animation-delay:.16s}
@keyframes entra{from{opacity:0;transform:translateX(-40px)}}
.mc.actual{box-shadow:inset 0 0 0 2px var(--gold),0 0 30px -8px var(--gold)}
.mc .hora{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(7,10,18,.6);border-right:1px solid rgba(255,255,255,.08)}
.mc .hora b{font-size:56px;font-weight:800;line-height:1;color:#fff}
.mc .hora small{font-size:20px;letter-spacing:3px;color:var(--gold2);margin-top:6px}
.mc .eq{display:flex;align-items:center;gap:22px;padding:0 30px;min-width:0}
.mc .eq.r{flex-direction:row-reverse;text-align:right}
.mc .eq .lg{width:96px;height:96px;flex:none;display:grid;place-items:center}
.mc .eq .lg img{max-width:100%;max-height:100%;object-fit:contain}
.mc .eq b{font-size:52px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mc .vs{text-align:center;line-height:1}
.mc .vs b{font-size:58px;font-weight:800;color:var(--gold);display:block}
.mc .vs small{font-size:20px;letter-spacing:3px;color:#8d96b5}
.mc .sc{font-size:62px;font-weight:800;color:#fff}

/* ---------- abajo: el partido que viene ---------- */
#pie{position:absolute;left:0;top:848px;width:1400px;height:232px;border-top:2px solid var(--linea)}
#pie .lab{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:30px;font-weight:700;letter-spacing:3px}
#pie .bo{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:30px;font-weight:700;letter-spacing:3px}
#pie .fila{position:absolute;left:0;right:0;top:58px;height:118px;display:grid;
 grid-template-columns:1fr 160px 1fr;align-items:center}
#pie .eq{display:flex;align-items:center;gap:26px;justify-content:flex-end;min-width:0;padding:0 10px}
#pie .eq.r{justify-content:flex-start;flex-direction:row-reverse}
#pie .eq.r{flex-direction:row}
#pie .eq .lg{width:118px;height:118px;flex:none;display:grid;place-items:center}
#pie .eq .lg img{max-width:100%;max-height:100%;object-fit:contain}
#pie .eq b{font-size:92px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pie .vs{text-align:center;font-size:110px;font-weight:800;line-height:1;color:var(--gold);
 text-shadow:0 0 24px rgba(233,185,73,.45)}
#pie .nada{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;
 letter-spacing:3px;color:var(--gold)}

/* ---------- columna derecha ---------- */
#col{position:absolute;left:1400px;top:0;width:520px;height:1080px;border-left:2px solid var(--linea)}
#col .tlogo{position:absolute;left:30px;right:30px;top:30px;height:180px;display:grid;place-items:center}
#col .tlogo img{max-width:100%;max-height:100%;object-fit:contain}
#col .tlogo b{display:block;overflow:hidden;max-width:100%;font-size:56px;font-weight:800;line-height:.95;text-align:center;color:var(--gold)}
#col .tlogo small{display:block;font-size:24px;letter-spacing:3px;color:#8d96b5;margin-top:8px}
/* los comentaristas */
#col .cast{position:absolute;left:0;right:0;top:226px;height:420px}
#col .fotos{position:absolute;left:0;right:0;top:0;bottom:56px;display:flex;align-items:flex-end;justify-content:center}
#col .fotos{padding:0 14px}
#col .fotos img{flex:1 1 0;min-width:0;height:100%;object-fit:contain;object-position:bottom;
 filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
#col .nombres{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;
 justify-content:center;gap:14px;padding:0 10px;background:rgba(7,10,18,.85);
 border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
#col .nombres b{font-size:28px;font-weight:700;letter-spacing:1px;color:var(--gold2);white-space:nowrap}
#col .nombres i{font-style:normal;color:var(--gold);font-size:18px}
#col .cast.sinfotos{height:120px}
#col .cast.sinfotos .nombres{flex-direction:column;height:auto;gap:4px;padding:12px 10px;top:auto}
/* la cuenta regresiva */
#col .cd{position:absolute;left:0;right:0;top:680px;text-align:center}
#col .cd small{display:block;font-size:34px;font-weight:700;letter-spacing:2px}
#col .cd b{display:block;font-size:150px;font-weight:800;line-height:.95;letter-spacing:2px;
 font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,255,255,.18)}
#col .cd b.largo{font-size:112px}
#col .cd em{display:block;font-style:normal;font-size:54px;font-weight:800;line-height:1.05;color:var(--gold);margin-top:20px}
/* los auspiciantes */
#col .spon{position:absolute;left:30px;right:30px;bottom:30px;height:140px;display:grid;place-items:center}
#col .spon img{max-width:100%;max-height:100%;object-fit:contain;animation:aparece .7s ease both}
@keyframes aparece{from{opacity:0;transform:scale(.94)}}

/* ---------- Swiss Stage ---------- */
.swgrid{position:absolute;left:40px;right:40px;top:160px;bottom:30px;display:grid;gap:14px}
.swcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.swcol>*{flex-shrink:0}
.swcol .medio{flex-shrink:1}
.swcol .cab{text-align:center;font-size:20px;font-weight:700;letter-spacing:3px;color:#8d96b5;
 padding-bottom:8px;border-bottom:2px solid rgba(233,185,73,.35);margin-bottom:10px}
.swcol .medio{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.swbox{flex:none;background:rgba(7,10,18,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.swbox .rec{display:flex;justify-content:space-between;align-items:baseline;padding:4px 10px 3px;
 font-size:24px;font-weight:800;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.swbox .rec small{font-size:15px;letter-spacing:2px;color:#8d96b5;font-weight:700}
.swbox.dec .rec small{color:var(--gold)}
.swbox.vacia{opacity:.45}
.swbox.vacia .pd{padding:14px;text-align:center;font-size:18px;letter-spacing:2px;color:#8d96b5}
.swm+.swm{border-top:1px solid rgba(255,255,255,.1)}
.swt{display:flex;align-items:center;gap:8px;height:var(--fila,36px);padding:0 10px}
.swt img,.swt .sl{width:calc(var(--fila,36px) - 8px);height:calc(var(--fila,36px) - 8px);object-fit:contain;flex:none}
.swt span{flex:1;min-width:0;font-size:calc(var(--fila,36px) * .58);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swt b{font-size:calc(var(--fila,36px) * .66);font-weight:800;min-width:20px;text-align:right;color:#5b6482}
.swt.gana b{color:var(--gold)}
.swt.pierde{opacity:.42}
.swt.bye span{color:#8d96b5;font-style:italic}
.swres{display:flex;align-items:center;gap:8px;height:var(--fila,36px);padding:0 10px;border-radius:5px;margin-bottom:6px}
.swres.ok{background:linear-gradient(90deg,#17834c,#35c978);color:#03140a}
.swres.out{background:linear-gradient(90deg,#8e1229,#e23a51);color:#fff;margin:6px 0 0}
.swres img{width:calc(var(--fila,36px) - 8px);height:calc(var(--fila,36px) - 8px);object-fit:contain}
.swres span{flex:1;min-width:0;font-size:calc(var(--fila,36px) * .58);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swres b{font-size:calc(var(--fila,36px) * .55);font-weight:800}
.swlab{text-align:center;font-size:14px;font-weight:700;letter-spacing:3px;margin:0 0 6px}
.swlab.ok{color:#35c978}.swlab.out{color:#ff5d70;margin:8px 0 0}
/* pantalla completa (schedule-overlay.html?swiss) */
body.solo #pie,body.solo #col{display:none}
body.solo #main{width:1920px;height:1080px}
</style></head><body><div id="app">
 <div id="main"></div>
 <div id="pie" class="panel"></div>
 <div id="col" class="panel">
   <div class="tlogo" id="tlogo"></div>
   <div class="cast" id="cast"></div>
   <div class="cd" id="cd"></div>
   <div class="spon" id="spon"></div>
 </div>
</div>
<script src="theme.js"></script>
<script src="swiss.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,pag=0,spi=0,SW=null;
const SOLO=/[?&]swiss\b/.test(location.search);

/* ---------- cuenta regresiva ----------
   Dos formas de cargarla desde el panel: "en N minutos" (guarda el momento exacto
   en cd.hasta) o una hora fija del dia (cd.at, por ejemplo 20:30). */
function faltan(){const C=S.cd||{};
  if(C.hasta)return Math.round((C.hasta-Date.now())/1000);
  if(!C.at)return null;const[h,m]=C.at.split(':').map(Number);if(isNaN(h))return null;
  const o=new Date();o.setHours(h,m||0,0,0);let s=Math.round((o-Date.now())/1000);
  if(s<-3600)s+=86400;return s}
function reloj(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),g=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(g).padStart(2,'0')}
function pintarCd(){const el=$('cd'),C=S.cd||{};
  if(S.sw&&S.sw.countdown===false){el.innerHTML='';return}
  const s=faltan();if(s===null){el.innerHTML='';return}
  if(s>0){const t=reloj(s);
    el.innerHTML=`<small>${esc(C.label||'Empezamos en:')}</small><b class="${t.length>5?'largo':''}">${t}</b>`}
  else el.innerHTML=`<em>${esc(C.end||'¡Empezamos!')}</em>`}

/* ---------- columna ---------- */
function pintarCol(){const E=S.ev||{};
  $('tlogo').innerHTML=E.logo?`<img src="${E.logo}">`
    :`<b>${esc(E.title||'Torneo')}${E.stage?`<small>${esc(E.stage)}</small>`:''}</b>`;
  /* comentaristas: los grupos prendidos en el panel, hasta cuatro personas */
  const gente=[];[['hosts',0],['casters',1],['analysts',2]].forEach(([k,i])=>{
    if(S.show&&S.show[k]&&S.talent&&S.talent[i])S.talent[i].people.forEach(p=>{if(p.name)gente.push(p)})});
  const g=gente.slice(0,4),conFoto=g.some(p=>p.photo);
  $('cast').className='cast'+(conFoto?'':' sinfotos');
  $('cast').innerHTML=g.length?`${conFoto?`<div class="fotos">${g.filter(p=>p.photo).map(p=>`<img src="${p.photo}">`).join('')}</div>`:''}
    <div class="nombres">${g.map(p=>`<b>${esc(p.name)}</b>`).join('<i>✖</i>')}</div>`:'';
  encajarTitulo();pintarSpon()}
function pintarSpon(){const L=(S.sponsors||[]).filter(Boolean);
  if(!L.length||(S.sw&&S.sw.sponsor===false)){$('spon').innerHTML='';return}
  $('spon').innerHTML=`<img src="${L[spi%L.length]}">`}

/* ---------- abajo ---------- */
function partidosDelDia(){return (S.matches||[]).map((m,i)=>Object.assign({i},m)).filter(m=>m.on)}
function pintarPie(){const ms=partidosDelDia();
  let m=ms.find(x=>x.i===S.actual);if(!m)m=ms[0];
  if(!m){$('pie').innerHTML=`<div class="nada">${esc((S.ev&&S.ev.title)||'Bienvenidos')}</div>`;return}
  const eq=(t,c)=>`<div class="eq ${c}"><b>${esc(t.name)||'Por definir'}</b><span class="lg">${t.logo?`<img src="${t.logo}">`:''}</span></div>`;
  $('pie').innerHTML=`<div class="lab">${esc(m.label||'Partida')}</div>
   <div class="fila">${eq(m.teams[0],'l')}<div class="vs">VS</div>${eq(m.teams[1],'r')}</div>
   ${m.bo?`<div class="bo">Al mejor de ${esc(m.bo)}</div>`:''}`;
  /* del lado derecho el logo va primero */
  const r=$('pie').querySelector('.eq.r');if(r)r.insertBefore(r.querySelector('.lg'),r.firstChild);
  encajar()}

/* ---------- ventana principal ---------- */
const POR_PAG=3;
function pintarMain(){const el=$('main'),modo=S.main||'video';
  if(modo==='swiss'&&SW){el.className='panel lleno';el.innerHTML=htmlSwiss();encajarSwiss();return}
  if(modo==='partidos'){const ms=partidosDelDia();
    if(ms.length){el.className='panel lleno';
      const n=Math.ceil(ms.length/POR_PAG),p=pag%n,vis=ms.slice(p*POR_PAG,p*POR_PAG+POR_PAG);
      const actual=(ms.find(x=>x.i===S.actual)||ms[0]).i;
      el.innerHTML=`<div class="mtit">Partidos de hoy</div>
       ${S.ev&&S.ev.stage?`<div class="msub">${esc(S.ev.stage)}</div>`:''}
       ${n>1?`<div class="mpag">${Array.from({length:n},(_,k)=>`<i class="${k===p?'on':''}"></i>`).join('')}</div>`:''}
       <div class="mlist">${vis.map(m=>`<div class="mc${m.i===actual?' actual':''}">
         <div class="hora"><b>${esc(m.time||'--:--')}</b><small>${esc(m.label||'')}</small></div>
         <div class="eq"><span class="lg">${m.teams[0].logo?`<img src="${m.teams[0].logo}">`:''}</span><b>${esc(m.teams[0].name)||'Por definir'}</b></div>
         <div class="vs">${m.teams[0].score!==''||m.teams[1].score!==''
           ?`<b class="sc">${esc(m.teams[0].score||0)} - ${esc(m.teams[1].score||0)}</b>`
           :`<b>VS</b>`}${m.bo?`<small>BO${esc(m.bo)}</small>`:''}</div>
         <div class="eq r"><span class="lg">${m.teams[1].logo?`<img src="${m.teams[1].logo}">`:''}</span><b>${esc(m.teams[1].name)||'Por definir'}</b></div>
       </div>`).join('')}</div>`;
      return}}
  /* video: hueco transparente */
  el.className='video';el.innerHTML=''}

/* ---------- Swiss Stage ---------- */
function htmlSwiss(){const W=SW,C=SWISS.calcular(W),T=W.teams,meta=C.meta,nr=meta*2-1;
  const tm=i=>T[i]||{name:'',logo:''};
  const nom=i=>esc(tm(i).name)||'Equipo '+(i+1);
  const lg=t=>t.logo?`<img src="${t.logo}">`:`<i class="sl"></i>`;
  const fila=(i,m,lado)=>{if(i==null||i<0)return `<div class="swt bye"><i class="sl"></i><span>Libre</span><b></b></div>`;
    const g=SWISS.ganador(m),sc=lado?m.sb:m.sa;
    return `<div class="swt ${g<0?'':g===i?'gana':'pierde'}">${lg(tm(i))}<span>${nom(i)}</span><b>${sc===''||sc==null?'':esc(sc)}</b></div>`};
  /* los grupos de mejor record van arriba */
  const clave=k=>{const v=k.split(' / ').map(x=>{const[w,l]=x.split('-').map(Number);return w-l});return -(v.reduce((a,b)=>a+b,0)/v.length)};
  const res=(r,tipo)=>{const L=T.map((t,i)=>i).filter(i=>C.fin[i]===r&&C.estado[i]===tipo);
    if(!L.length)return '';
    const chips=L.map(i=>`<div class="swres ${tipo}">${lg(tm(i))}<span>${nom(i)}</span><b>${C.rec[i].w}-${C.rec[i].l}</b></div>`).join('');
    return tipo==='ok'?`<div class="swlab ok">Clasificado${L.length>1?'s':''}</div>${chips}`:`${chips}<div class="swlab out">Eliminado${L.length>1?'s':''}</div>`};
  let cols='';
  for(let r=0;r<=nr;r++){
    const R=(W.rounds||[])[r];let medio='';
    if(r<nr){
      if(R&&R.length){const grupos=[];
        R.forEach(m=>{const k=SWISS.grupoDe(C,r,m);let g=grupos.find(x=>x.k===k);if(!g)grupos.push(g={k,ms:[]});g.ms.push(m)});
        grupos.sort((a,b)=>clave(a.k)-clave(b.k));
        medio=grupos.map(g=>{const dec=g.ms.some(m=>SWISS.esDecisivo(C,r,m));
          return `<div class="swbox ${dec?'dec':''}"><div class="rec">${esc(g.k)}<small>BO${dec?(W.boDec||5):(W.bo||3)}</small></div>
            ${g.ms.map(m=>`<div class="swm">${fila(m.a,m,0)}${fila(m.b,m,1)}</div>`).join('')}</div>`}).join('')}
      else medio=`<div class="swbox vacia"><div class="pd">Por definir</div></div>`}
    cols+=`<div class="swcol"><div class="cab">${r<nr?'Ronda '+(r+1):'Final'}</div>
      ${r>0?res(r-1,'ok'):''}<div class="medio">${medio}</div>${r>0?res(r-1,'out'):''}</div>`}
  const alto=T.length>8?(SOLO?36:30):(SOLO?44:38);
  return `<div class="mtit">Swiss Stage</div>${S.ev&&S.ev.stage?`<div class="msub">${esc(S.ev.stage)}</div>`:''}
   <div class="swgrid" style="grid-template-columns:repeat(${nr+1},1fr);--fila:${alto}px">${cols}</div>`}

/* si alguna columna no entra, achica las filas hasta que entre */
function encajarSwiss(){const g=document.querySelector('.swgrid');if(!g)return;
  let f=parseInt(g.style.getPropertyValue('--fila'))||36;
  const sobra=()=>[...g.querySelectorAll('.swcol')].some(c=>c.scrollHeight>c.clientHeight+1);
  while(sobra()&&f>18){f--;g.style.setProperty('--fila',f+'px')}
  g.querySelectorAll('.medio').forEach(m=>m.style.gap=f<28?'8px':'')}

/* achica los nombres largos para que entren */
function encajarTitulo(){const el=document.querySelector('#col .tlogo b');if(!el)return;
  let f=56;el.style.fontSize=f+'px';while((el.scrollWidth>el.clientWidth||el.scrollHeight>180)&&f>24){f-=2;el.style.fontSize=f+'px'}}
function encajar(){document.querySelectorAll('#pie .eq b').forEach(el=>{
  let f=92;el.style.fontSize=f+'px';while(el.scrollWidth>el.clientWidth&&f>40){f-=2;el.style.fontSize=f+'px'}})}

function pintar(){if(!S)return;pintarMain();pintarPie();pintarCol();pintarCd()}

/* ---------- lo que rota ---------- */
let tp=null,ts=null;
function ciclos(){clearInterval(tp);clearInterval(ts);
  /* los partidos del dia pasan de a tres; se puede apagar desde el panel */
  if(S.rotar!==false)tp=setInterval(()=>{if((S.main||'')==='partidos'){pag++;pintarMain()}},Math.max(2,S.matchSecs||5)*1000);
  ts=setInterval(()=>{spi++;pintarSpon()},Math.max(2,S.sponsorSecs||7)*1000)}
setInterval(()=>{if(S)pintarCd()},500);

document.addEventListener('tema',()=>{if(S)pintar()});
new EventSource('/events?k=schedule').onmessage=e=>{
