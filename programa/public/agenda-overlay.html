<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Agenda del día</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* ============================================================================
   AGENDA DEL DIA (1920x1080, pantalla completa)
   Los partidos marcados en el Control de programacion, de a 2, 3 o 4 (se elige ahi).
   Arriba: logo del torneo, "AGENDA DEL DIA" y la fase con ronda y dia.
   ============================================================================ */
:root{--gold:#e9b949;--gold2:#f6d98a;--linea:rgba(233,185,73,.5)}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;color:#eef2ff;
 font-family:var(--fh,'Barlow Condensed'),'Bahnschrift',sans-serif;text-transform:uppercase}
body{background:radial-gradient(ellipse at 20% 0%,rgba(58,160,255,.16),transparent 55%),
 radial-gradient(ellipse at 85% 100%,rgba(233,185,73,.12),transparent 55%),
 repeating-linear-gradient(-60deg,rgba(233,185,73,.035) 0 1px,transparent 1px 28px),linear-gradient(180deg,#0e1530,#070a12 75%)}
.cab{position:absolute;left:110px;top:70px;display:flex;align-items:center;gap:40px}
.cab .lg{width:260px;height:260px;display:grid;place-items:center}
.cab .lg img{max-width:260px;max-height:260px;object-fit:contain}
.cab h1{font-size:170px;font-weight:800;line-height:.85;letter-spacing:2px}
.cab h2{font-size:64px;font-weight:700;color:var(--gold2);letter-spacing:4px;line-height:1}
.fase{position:absolute;right:110px;top:200px;text-align:center;min-width:520px}
.fase b{display:block;padding:12px 46px;font-size:62px;font-weight:800;line-height:1;background:linear-gradient(90deg,#141d3d,#1d2a55);
 border:2px solid var(--gold);clip-path:polygon(28px 0,100% 0,calc(100% - 28px) 100%,0 100%)}
.fase div{display:flex;justify-content:center;margin-top:-2px}
.fase span{padding:8px 44px;font-size:48px;font-weight:800;color:#111;background:linear-gradient(180deg,var(--gold2),var(--gold));
 clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.fase span+span{margin-left:-14px;background:linear-gradient(180deg,#f3e2b3,#cfa64a)}
.cards{position:absolute;left:0;right:0;top:430px;bottom:100px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:70px 110px}
.cd{position:relative;width:760px;height:200px;animation:entra .6s cubic-bezier(.2,.9,.2,1) both}
.cd:nth-child(2){animation-delay:.1s}.cd:nth-child(3){animation-delay:.2s}.cd:nth-child(4){animation-delay:.3s}
@keyframes entra{from{opacity:0;transform:translateY(30px)}}
.cd .tab{position:absolute;left:50%;top:-40px;transform:translateX(-50%);padding:6px 46px;font-size:32px;font-weight:800;letter-spacing:2px;
 background:linear-gradient(180deg,#24366e,#141d3d);border:2px solid var(--gold);border-bottom:0;
 clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 100%,0 100%);white-space:nowrap}
.cd .cuerpo{position:absolute;inset:0;display:grid;grid-template-columns:170px 110px 1fr 110px 170px;align-items:center;
 background:linear-gradient(90deg,rgba(47,128,255,.28),rgba(14,21,48,.92) 35%,rgba(14,21,48,.92) 65%,rgba(255,61,85,.26));
 border:2px solid var(--linea);clip-path:polygon(26px 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%,0 26px)}
.cd .eq{text-align:center}
.cd .eq .l{height:118px;display:grid;place-items:center}
.cd .eq img{max-width:130px;max-height:118px;object-fit:contain}
.cd .eq b{display:block;font-size:30px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;padding:0 6px}
.cd .sc{font-size:120px;font-weight:800;text-align:center;line-height:1}
.cd .vs{text-align:center}
.cd .vs b{display:block;font-size:110px;font-weight:800;line-height:.9;color:var(--gold);text-shadow:0 0 24px rgba(233,185,73,.4)}
.cd .vs small{display:block;white-space:nowrap;font-size:24px;font-weight:700;letter-spacing:1px;margin-top:8px}
.nada{position:absolute;left:0;right:0;top:620px;text-align:center;font-size:60px;font-weight:800;color:#8d96b5}
.spon{position:absolute;right:110px;top:60px;width:260px;height:110px;text-align:center}
.spon small{display:block;font-size:18px;letter-spacing:3px;color:#8d96b5;margin-bottom:6px}
.spon img{max-width:260px;max-height:80px;object-fit:contain}
</style></head><body>
<div id="app"></div><div class="spon" data-spon="etq"></div><div id="tic"></div>
<script src="theme.js"></script>
<script src="programa.js"></script>
<script>
const P=PROG,esc=P.esc;
document.head.insertAdjacentHTML('beforeend',`<style>${P.tickerCSS}</style>`);
function pintar(S){const E=S.ev,n=Math.min(4,Math.max(2,+S.agendaN||3)),L=P.partidos().slice(0,n);
  const eq=t=>`<div class="eq"><div class="l">${t.logo?`<img src="${t.logo}">`:''}</div><b>${esc(P.corto(t))}</b></div>`;
  const sc=v=>`<div class="sc">${esc(v===''||v==null?0:v)}</div>`;
  document.getElementById('app').innerHTML=`
   <div class="cab">${E.logo?`<div class="lg"><img src="${E.logo}"></div>`:''}<div><h1>Agenda</h1><h2>Del día</h2></div></div>
   ${E.stage||E.round||E.day?`<div class="fase">${E.stage?`<b>${esc(E.stage)}</b>`:''}
     ${E.round||E.day?`<div>${E.round?`<span>${esc(E.round)}</span>`:''}${E.day?`<span>${esc(E.day)}</span>`:''}</div>`:''}</div>`:''}
   ${L.length?`<div class="cards">${L.map(m=>`<div class="cd"><div class="tab">${esc(m.label||'Partido')}</div><div class="cuerpo">
     ${eq(m.teams[0])}${sc(m.teams[0].score)}<div class="vs"><b>VS</b><small>${esc(m.time||'')}${m.bo?(m.time?' | ':'')+'MD'+esc(m.bo):''}</small></div>${sc(m.teams[1].score)}${eq(m.teams[1])}
   </div></div>`).join('')}</div>`:`<div class="nada">Marcá los partidos del día en el Control de programación</div>`}`;
  P.encajar('.cd .eq b',30,16);P.ponerTicker(document.getElementById('tic'))}
P.empezar(pintar);
</script></body></html>
